# CI pipeline: secret scan + lint, typecheck, tests and build on every push to main and every PR.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --verbose --exit-code 1

  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm_ci_password
          POSTGRES_DB: crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm -d crm"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      # Runtime user (crm_app, RLS enforced) vs migration owner (crm) — same split as local dev.
      DATABASE_URL: postgresql://crm_app:crm_app_local_password@localhost:5432/crm
      MIGRATION_DATABASE_URL: postgresql://crm:crm_ci_password@localhost:5432/crm
      TEST_DATABASE_URL: postgresql://crm_app:crm_app_local_password@localhost:5432/crm_test
      TEST_MIGRATION_DATABASE_URL: postgresql://crm:crm_ci_password@localhost:5432/crm_test
      SHADOW_DATABASE_URL: postgresql://crm:crm_ci_password@localhost:5432/crm_shadow
      CORS_ORIGINS: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create databases and the crm_app role (same scripts as docker-compose)
        env:
          PGPASSWORD: crm_ci_password
        run: |
          psql -h localhost -U crm -d crm -v ON_ERROR_STOP=1 -f infra/postgres/init/01-create-test-database.sql
          psql -h localhost -U crm -d crm -v ON_ERROR_STOP=1 -f infra/postgres/init/02-create-app-role.sql
          psql -h localhost -U crm -d crm -v ON_ERROR_STOP=1 -c "CREATE DATABASE crm_shadow"
      - run: pnpm format:check
      - run: pnpm db:validate
      - run: pnpm db:migrate:deploy
      - run: pnpm db:migrate:test
      - name: Migrations match schema (no drift)
        run: pnpm db:migrate:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
